name: Python smoke test
on:
  push:
    branches: [ main ]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile app.py architecture_engine.py architecture_routes.py gis_masterplan.py cadastral_zoning.py