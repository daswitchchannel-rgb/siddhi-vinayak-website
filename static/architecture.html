<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SV Architecture AI</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef2ff}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#141b31;border:1px solid #2b3556;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}input,select,button{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #394566;background:#0d1427;color:#fff}button{cursor:pointer}.out{white-space:pre-wrap;font-family:ui-monospace}</style></head><body><div class="wrap"><h1>SV Architecture AI</h1><p>UP 2025 preliminary planning + AutoCAD/DXF assistant.</p><div class="card"><h2>Residential Rule Check</h2><div class="grid"><label>Plot area m²<input id="area" type="number" value="139.35"></label><label>Frontage m<input id="frontage" type="number" value="9.144"></label><label>Depth m<input id="depth" type="number" value="15.24"></label><label>Road width m<input id="road" type="number" value="9"></label><label>Use<select id="use"><option value="single">Single Unit</option><option value="multi">Multi Unit</option></select></label><label>Area<select id="built"><option value="1">Built-up</option><option value="0">Non-built-up</option></select></label></div><br><button onclick="check()">Calculate</button><div id="out" class="out"></div></div><div class="card"><h2>Master Plan 2031 Position</h2><div class="grid"><label>Longitude<input id="lon" value="77.67361"></label><label>Latitude<input id="lat" value="27.49250"></label></div><br><button onclick="loc()">Inspect</button><div id="mapout" class="out"></div></div></div><script>async function check(){let x={plot_area_sqm:+area.value,frontage_m:+frontage.value,depth_m:+depth.value,road_width_m:+road.value,use_type:use.value,built_up_area:!!+built.value};let r=await fetch('/api/architecture/residential/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});out.textContent=JSON.stringify(await r.json(),null,2)}async function loc(){let r=await fetch('/api/architecture/masterplan/location?lon='+lon.value+'&lat='+lat.value);mapout.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
